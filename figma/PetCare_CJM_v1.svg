<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1180" viewBox="0 0 1920 1180"><rect width="1920" height="1180" fill="#F8FAFC"/><text x="60" y="60" font-family="Inter,Arial" font-size="30" font-weight="700" fill="#15324A">PetCare · Customer Journey Map (v1) · Propietario reserva un servicio</text><text x="60" y="95" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569">Persona sintetica: Ana, 34, Medellin, propietaria de Luna (perro, 4 anos). Base: mapa de empafia y POV de la Actividad 1.</text><text x="60" y="130" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#9A6700">Nota de integridad: la curva emocional es hipotesis de diseno hasta ejecutar las pruebas de usabilidad reales (estructura V1 a V2 en pagina 02).</text><rect x="190" y="155" width="1590" height="910" rx="14" fill="#fff" stroke="#E2E8F0" stroke-width="1.5"/><text x="208" y="190" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#15324A">1. Descubrir</text><text x="208" y="212" font-family="Inter,Arial" font-size="11" font-weight="400" fill="#475569">Busca veterinaria</text><text x="493" y="190" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#15324A">2. Evaluar</text><text x="493" y="212" font-family="Inter,Arial" font-size="11" font-weight="400" fill="#475569">Compara opciones</text><text x="778" y="190" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#15324A">3. Solicitar</text><text x="778" y="212" font-family="Inter,Arial" font-size="11" font-weight="400" fill="#475569">Llena la solicitud</text><text x="1063" y="190" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#15324A">4. Esperar</text><text x="1063" y="212" font-family="Inter,Arial" font-size="11" font-weight="400" fill="#475569">Espera decision</text><text x="1348" y="190" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#15324A">5. Recibir servicio</text><text x="1348" y="212" font-family="Inter,Arial" font-size="11" font-weight="400" fill="#475569">Asiste y cierre</text><text x="1633" y="190" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#15324A">6. Volver</text><text x="1633" y="212" font-family="Inter,Arial" font-size="11" font-weight="400" fill="#475569">Consulta historial</text><line x1="465" y1="155" x2="465" y2="1065" stroke="#F1F5F9" stroke-width="2"/><line x1="750" y1="155" x2="750" y2="1065" stroke="#F1F5F9" stroke-width="2"/><line x1="1035" y1="155" x2="1035" y2="1065" stroke="#F1F5F9" stroke-width="2"/><line x1="1320" y1="155" x2="1320" y2="1065" stroke="#F1F5F9" stroke-width="2"/><line x1="1605" y1="155" x2="1605" y2="1065" stroke="#F1F5F9" stroke-width="2"/><text x="180" y="250" font-family="Inter,Arial" font-size="11" font-weight="700" fill="#475569" text-anchor="end">Acciones</text><text x="208" y="250" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Abre PetCare, define servicio,</text><text x="208" y="269" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">fecha y zona</text><text x="493" y="250" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Abre fichas, lee resenas, precio y</text><text x="493" y="269" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">condiciones</text><text x="778" y="250" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Elige mascota, slot y revisa el</text><text x="778" y="269" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">resumen</text><text x="1063" y="250" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Consulta el estado desde el panel</text><text x="1348" y="250" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Asiste al servicio con</text><text x="1348" y="269" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">confirmacion visible</text><text x="1633" y="250" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Vuelve al historial y deja el</text><text x="1633" y="269" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">registro en orden</text><text x="180" y="410" font-family="Inter,Arial" font-size="11" font-weight="700" fill="#475569" text-anchor="end">Necesidades / pensamientos</text><text x="208" y="410" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Espero no tener que llamar a cinco</text><text x="208" y="429" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">lados</text><text x="493" y="410" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Confiare si veo senales</text><text x="493" y="429" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">verificables, no promesas</text><text x="778" y="410" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Que quede claro que reserve</text><text x="778" y="429" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">exactamente</text><text x="1063" y="410" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Necesito saber si me confirmaron o</text><text x="1063" y="429" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">no</text><text x="1348" y="410" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Quiero que el dia coincida con lo</text><text x="1348" y="429" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">acordado</text><text x="1633" y="410" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Guardo el registro para la proxima</text><text x="1633" y="429" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">vez</text><text x="180" y="570" font-family="Inter,Arial" font-size="11" font-weight="700" fill="#475569" text-anchor="end">Touchpoints</text><text x="208" y="570" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Login, buscar, resultados</text><text x="493" y="570" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Ficha de servicio, disponibilidad</text><text x="778" y="570" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Reservar, revisar</text><text x="1063" y="570" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Estado, notificacion interna</text><text x="1348" y="570" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Agenda del proveedor</text><text x="1633" y="570" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Historial</text><text x="180" y="730" font-family="Inter,Arial" font-size="11" font-weight="700" fill="#475569" text-anchor="end">Friccion / riesgo</text><text x="208" y="730" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Demasiados filtros o terminos</text><text x="208" y="749" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">clinicos</text><text x="493" y="730" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Resenas sin origen verificable</text><text x="493" y="749" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">(BR-12)</text><text x="778" y="730" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Resumen poco visible antes de</text><text x="778" y="749" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">enviar</text><text x="1063" y="730" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Estado poco claro o solo en color</text><text x="1348" y="730" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Cambio de horario sin aviso (fuera</text><text x="1348" y="749" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">de MVP)</text><text x="1633" y="730" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Historial sin paginacion</text><text x="1633" y="749" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">(RNF-PERF-04)</text><text x="180" y="890" font-family="Inter,Arial" font-size="11" font-weight="700" fill="#475569" text-anchor="end">Oportunidades / decisiones</text><text x="208" y="890" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Filtros esenciales y vacio</text><text x="208" y="909" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">explicito con contexto (RF-03.04)</text><text x="493" y="890" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Ficha con senales declaradas y</text><text x="493" y="909" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">alcance explicito (RF-04.02)</text><text x="778" y="890" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Resumen previo obligatorio</text><text x="778" y="909" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">(RF-06.02) + confirmacion</text><text x="778" y="928" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">contextual (RNF-USAB-04)</text><text x="1063" y="890" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Estado en texto y linea de tiempo</text><text x="1063" y="909" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">con auditoria (RNF-USAB-02, BR-09)</text><text x="1348" y="890" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Notificacion interna desacoplada</text><text x="1348" y="909" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">(BR-10)</text><text x="1633" y="890" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">Historial paginado y trazable</text><text x="1633" y="909" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#1F2937">(HU-07)</text><text x="180" y="1035" font-family="Inter,Arial" font-size="11" font-weight="700" fill="#475569" text-anchor="end">Emocion (hipotesis)</text><polyline points="320,1060 605,1042 890,1051 1175,1078 1460,1033 1745,1042" fill="none" stroke="#0B6B61" stroke-width="3" stroke-dasharray="8 6"/><circle cx="320" cy="1060" r="7" fill="#0B6B61"/><circle cx="605" cy="1042" r="7" fill="#0B6B61"/><circle cx="890" cy="1051" r="7" fill="#0B6B61"/><circle cx="1175" cy="1078" r="7" fill="#0B6B61"/><circle cx="1460" cy="1033" r="7" fill="#0B6B61"/><circle cx="1745" cy="1042" r="7" fill="#0B6B61"/><text x="190" y="1090" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#475569">Valle emocional en Esperar; pico al recibir el servicio confirmado. Se validara con pruebas de usabilidad reales (minimo 4 propietarios).</text></svg>