<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000"><rect width="1600" height="2000" fill="#F8FAFC"/><text x="70" y="80" font-family="Inter,Arial" font-size="36" font-weight="700" fill="#15324A">PetCare · UIKit v0.2 (operativo minimo)</text><text x="70" y="118" font-family="Inter,Arial" font-size="15" font-weight="400" fill="#475569">Cierre del gap A2-WIP-02: select, textarea, checkbox/radio, navegacion, 5 estados, tabla/tarjeta responsive y patrones de feedback.</text><text x="70" y="190" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#15324A">1 · Formularios</text><text x="70" y="220" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#1F2937">Input / Default</text><rect x="70" y="228" width="360" height="44" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><text x="84" y="256" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#475569">Texto persistente</text><text x="470" y="220" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#1F2937">Select</text><rect x="470" y="228" width="360" height="44" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><path d="M 806 244 l 6 8 l 6 -8" fill="none" stroke="#475569" stroke-width="1.8"/><text x="484" y="256" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#475569">Opcion seleccionada</text><text x="870" y="220" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#1F2937">Input con error</text><rect x="870" y="228" width="360" height="44" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><text x="884" y="256" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#475569">Entrada invalida</text><text x="870" y="308" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#B42318">Indica el campo y la accion de correccion (RNF-USAB-03).</text><text x="70" y="340" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#1F2937">Textarea</text><rect x="70" y="348" width="1160" height="96" rx="10" fill="#fff" stroke="#CBD5E1"/><text x="84" y="380" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#475569">Observaciones operativas (multilinea, 4 filas, altura auto).</text><text x="70" y="500" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#15324A">2 · Selecciones</text><rect x="70" y="530" width="24" height="24" rx="6" fill="#0B6B61"/><path d="M 75 543 l 5 5 l 9 -11" fill="none" stroke="#fff" stroke-width="2.5"/><text x="106" y="548" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#1F2937">Checkbox activo</text><rect x="320" y="530" width="24" height="24" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><text x="356" y="548" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569">Checkbox inactivo</text><circle cx="580" cy="542" r="11" fill="#0B6B61"/><circle cx="580" cy="542" r="4.5" fill="#fff"/><text x="606" y="548" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#1F2937">Radio activo</text><circle cx="780" cy="542" r="11" fill="none" stroke="#475569" stroke-width="2"/><text x="806" y="548" font-family="Inter,Arial" font-size="14" font-weight="400" fill="#475569">Radio inactivo</text><text x="70" y="620" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#15324A">3 · Navegacion</text><rect x="70" y="650" width="1460" height="60" fill="#fff" stroke="#E2E8F0"/><rect x="70" y="650" width="1460" height="1" fill="#E2E8F0"/><text x="90" y="686" font-family="Inter,Arial" font-size="16" font-weight="700" fill="#0B6B61">PetCare</text><text x="600" y="686" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#1F2937">Inicio</text><text x="680" y="686" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#475569">Buscar servicios</text><text x="830" y="686" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#475569">Mis mascotas</text><text x="960" y="686" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#475569">Reservas</text><rect x="1160" y="662" width="44" height="36" rx="8" fill="#EAF7F4"/><text x="1182" y="686" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#0B6B61" text-anchor="middle">Salir</text><text x="90" y="726" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#475569">Topbar: rol y navegacion principal siempre visibles; item activo en negrita.</text><rect x="70" y="740" width="240" height="180" rx="10" fill="#F1F5F9"/><text x="90" y="775" font-family="Inter,Arial" font-size="11" font-weight="700" fill="#0B6B61" letter-spacing="1">PROPIETARIO</text><rect x="82" y="790" width="216" height="40" rx="8" fill="#EAF7F4"/><text x="94" y="815" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#0B6B61">Buscar servicios</text><text x="94" y="850" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#475569">Mis mascotas</text><text x="94" y="884" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#475569">Reservas</text><text x="340" y="780" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#475569">Sidebar contextual por rol (260 px, colapsa a menu en mobile).</text><text x="340" y="805" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#475569">Layout B del sistema: sidebar + contenido con tarjetas y estados.</text><text x="70" y="970" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#15324A">4 · Estados de reserva (texto + color, nunca solo color · RNF-USAB-02)</text><rect x="70" y="1010" width="110" height="30" rx="15" fill="#EFF8FF"/><text x="125" y="1030" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#175CD3" text-anchor="middle">Solicitada</text><rect x="200" y="1010" width="110" height="30" rx="15" fill="#ECF8EF"/><text x="255" y="1030" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#237A3B" text-anchor="middle">Confirmada</text><rect x="330" y="1010" width="110" height="30" rx="15" fill="#FFF0EE"/><text x="385" y="1030" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#B42318" text-anchor="middle">Rechazada</text><rect x="460" y="1010" width="110" height="30" rx="15" fill="#FFF8D8"/><text x="515" y="1030" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#9A6700" text-anchor="middle">Cancelada</text><rect x="590" y="1010" width="110" height="30" rx="15" fill="#F1F5F9"/><text x="645" y="1030" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Completada</text><rect x="760" y="995" width="770" height="60" rx="12" fill="#EAF7F4" stroke="#0B6B61" stroke-width="1.5"/><text x="780" y="1025" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#237A3B">Confirmada</text><text x="890" y="1025" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#1F2937">Centro Huellas · 05 Oct 10:30 · estado explicito en texto</text><text x="70" y="1100" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#15324A">5 · Tabla (desktop) y tarjeta (mobile)</text><rect x="70" y="1130" width="700" height="200" rx="10" fill="#fff" stroke="#E2E8F0" stroke-width="1.5"/><text x="94" y="1170" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#475569">Fecha</text><text x="264" y="1170" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#475569">Servicio</text><text x="434" y="1170" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#475569">Proveedor</text><text x="604" y="1170" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#475569">Estado</text><rect x="90" y="1181" width="660" height="48" rx="8" fill="#F1F5F9"/><text x="106" y="1210" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#1F2937">05 Oct</text><text x="276" y="1210" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#1F2937">Valoracion</text><text x="446" y="1210" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#1F2937">Huellas</text><rect x="560" y="1191" width="110" height="30" rx="15" fill="#ECF8EF"/><text x="615" y="1211" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#237A3B" text-anchor="middle">Confirmada</text><rect x="90" y="1237" width="660" height="48" rx="8" fill="#F1F5F9"/><text x="106" y="1266" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#1F2937">05 Oct</text><text x="276" y="1266" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#1F2937">Valoracion</text><text x="446" y="1266" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#1F2937">Huellas</text><rect x="560" y="1247" width="110" height="30" rx="15" fill="#ECF8EF"/><text x="615" y="1267" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#237A3B" text-anchor="middle">Confirmada</text><rect x="830" y="1130" width="240" height="200" rx="10" fill="#fff" stroke="#E2E8F0" stroke-width="1.5"/><text x="850" y="1165" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#15324A">05 Oct · Valoracion</text><text x="850" y="1190" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#475569">Centro Huellas</text><rect x="850" y="1208" width="110" height="30" rx="15" fill="#ECF8EF"/><text x="905" y="1228" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#237A3B" text-anchor="middle">Confirmada</text><text x="850" y="1275" font-family="Inter,Arial" font-size="11" font-weight="400" fill="#475569">Tarjeta en viewport 360 px: misma informacion, apilada.</text><text x="1120" y="1130" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#475569">Tabla desktop y tarjeta mobile: misma data, patron responsive RNF-COMP-02.</text><text x="70" y="1390" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#15324A">6 · Patrones de feedback</text><rect x="70" y="1420" width="1460" height="54" rx="12" fill="#EFF8FF"/><text x="90" y="1453" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#175CD3">Info: prototipo demostrativo; valida navegacion sin backend.</text><rect x="70" y="1490" width="1460" height="54" rx="12" fill="#ECF8EF"/><text x="90" y="1523" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#237A3B">Exito: solicitud enviada; quedo en estado Solicitada.</text><rect x="70" y="1560" width="1460" height="54" rx="12" fill="#FFF0EE"/><text x="90" y="1593" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#B42318">Error: el horario dejo de estar disponible (RF-06.04); escoge otra opcion.</text><rect x="70" y="1630" width="1460" height="54" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/><text x="90" y="1663" font-family="Inter,Arial" font-size="13" font-weight="400" fill="#475569">Vacio: no hay coincidencias con esos filtros; ajusta los criterios sin perder contexto.</text><text x="70" y="1730" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#15324A">7 · Foco accesible (RNF-ACC-02/03)</text><rect x="70" y="1760" width="360" height="48" rx="10" fill="#fff" stroke="#0B6B61" stroke-width="2"/><text x="240" y="1790" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#15324A" text-anchor="middle">Boton enfocado</text><text x="70" y="1860" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#475569">Anillo de foco: 2 px primario + offset 2 px. Toda funcionalidad critica operable por teclado.</text><text x="70" y="1900" font-family="Inter,Arial" font-size="12" font-weight="400" fill="#475569">Convenciones: botones 44 px de alto minimo · etiquetas persistentes · ningun estado solo en color · tokens en design-tokens.json.</text></svg>